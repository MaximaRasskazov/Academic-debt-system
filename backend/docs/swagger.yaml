definitions:
  dto.AddRetakeStudentRequest:
    properties:
      debt_id:
        type: string
      student_id:
        type: string
    type: object
  dto.AddRetakeTeacherRequest:
    properties:
      teacher_id:
        type: string
    type: object
  dto.AttachStudentRequest:
    properties:
      academic_year:
        description: '"2025-2026"'
        type: string
      semester:
        description: 1 или 2
        type: integer
      source:
        description: manual / sync
        type: string
      student_id:
        type: string
    type: object
  dto.AttachTeacherRequest:
    properties:
      teacher_id:
        type: string
    type: object
  dto.AuthResponse:
    properties:
      access_expires_at:
        type: string
      access_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.CreateDebtRequest:
    properties:
      discipline_id:
        type: string
      external_id:
        type: string
      notes:
        type: string
      source:
        type: string
      student_id:
        type: string
    type: object
  dto.CreateDisciplineRequest:
    properties:
      code:
        type: string
      description:
        type: string
      external_id:
        type: string
      name:
        type: string
      source:
        description: manual / sync (default manual)
        type: string
    type: object
  dto.CreateRetakeRequest:
    properties:
      building:
        type: string
      discipline_id:
        type: string
      duration_minutes:
        type: integer
      kind:
        type: string
      notes:
        type: string
      room:
        type: string
      scheduled_at:
        type: string
    type: object
  dto.DebtResponse:
    properties:
      created_at:
        type: string
      discipline_id:
        type: string
      external_id:
        type: string
      final_grade:
        type: integer
      graded_at:
        type: string
      graded_by:
        type: string
      id:
        type: string
      issued_by:
        type: string
      notes:
        type: string
      source:
        type: string
      status:
        description: open / graded / cancelled
        type: string
      student_id:
        type: string
      updated_at:
        type: string
    type: object
  dto.DebtSummaryRow:
    properties:
      discipline_id:
        type: string
      graded_count:
        type: integer
      open_count:
        type: integer
    type: object
  dto.DebtsListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.DebtResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  dto.DebtsSummaryRow:
    properties:
      discipline_code:
        type: string
      discipline_id:
        type: string
      discipline_name:
        type: string
      graded_count:
        type: integer
      open_count:
        type: integer
    type: object
  dto.DisciplineResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      external_id:
        type: string
      id:
        type: string
      name:
        type: string
      source:
        type: string
      updated_at:
        type: string
    type: object
  dto.DisciplinesListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.DisciplineResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  dto.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  dto.GradeDebtRequest:
    properties:
      grade:
        type: integer
    type: object
  dto.GradeRetakeStudentRequest:
    properties:
      grade:
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.NotificationResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      kind:
        type: string
      payload:
        additionalProperties:
          type: any
        type: object
      read_at:
        type: string
    type: object
  dto.NotificationsListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.NotificationResponse'
        type: array
    type: object
  dto.ProfileResponse:
    properties:
      permissions:
        items:
          type: string
        type: array
      roles:
        items:
          $ref: '#/definitions/dto.RoleResponse'
        type: array
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.RegisterRequest:
    properties:
      birthday:
        type: string
      email:
        type: string
      first_name:
        type: string
      group_name:
        type: string
      last_name:
        type: string
      middle_name:
        type: string
      password:
        type: string
    type: object
  dto.ReportParticipant:
    properties:
      email:
        type: string
      full_name:
        type: string
      grade:
        type: integer
      group_name:
        type: string
      user_id:
        type: string
    type: object
  dto.RetakeParticipantResponse:
    properties:
      created_at:
        type: string
      debt_id:
        type: string
      grade:
        type: integer
      graded_at:
        type: string
      graded_by:
        type: string
      id:
        type: string
      kind:
        description: student / teacher / commission_member
        type: string
      retake_id:
        type: string
      user_id:
        type: string
    type: object
  dto.RetakeResponse:
    properties:
      building:
        type: string
      completed_at:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      discipline_id:
        type: string
      duration_minutes:
        type: integer
      id:
        type: string
      kind:
        description: regular / commission
        type: string
      min_teachers:
        type: integer
      notes:
        type: string
      room:
        type: string
      scheduled_at:
        type: string
      status:
        description: scheduled / in_progress / completed / cancelled
        type: string
      updated_at:
        type: string
    type: object
  dto.RetakesListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.RetakeResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
    type: object
  dto.RetakesReportRow:
    properties:
      building:
        type: string
      completed_at:
        type: string
      discipline_code:
        type: string
      discipline_name:
        type: string
      duration_minutes:
        type: integer
      kind:
        type: string
      retake_id:
        type: string
      room:
        type: string
      scheduled_at:
        type: string
      students:
        items:
          $ref: '#/definitions/dto.ReportParticipant'
        type: array
      teachers:
        items:
          $ref: '#/definitions/dto.ReportParticipant'
        type: array
    type: object
  dto.RoleResponse:
    properties:
      id:
        type: string
      level:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  dto.UnreadCountResponse:
    properties:
      count:
        type: integer
    type: object
  dto.UpdateDisciplineRequest:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        type: string
    type: object
  dto.UpdateRetakeRequest:
    properties:
      building:
        type: string
      duration_minutes:
        type: integer
      notes:
        type: string
      room:
        type: string
      scheduled_at:
        type: string
    type: object
  dto.UserResponse:
    properties:
      birthday:
        type: string
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      group_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      middle_name:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Неверные учётные данные
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Вход в систему
      tags:
      - auth
  /api/auth/logout:
    post:
      responses:
        "204":
          description: ""
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Выход из системы
      tags:
      - auth
  /api/auth/me:
    get:
      description: Возвращает пользователя, его роли и плоский список permissions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Профиль текущего пользователя
      tags:
      - auth
  /api/auth/refresh:
    post:
      description: 'Читает refresh-токен из httpOnly-cookie, возвращает новую пару.
        One-use: старый токен инвалидируется.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "401":
          description: Cookie отсутствует или токен недействителен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Обновление access-токена
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные для регистрации
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Email уже занят
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Регистрация нового пользователя
      tags:
      - auth
  /api/debts:
    get:
      parameters:
      - description: Лимит
        in: query
        name: limit
        type: integer
      - description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DebtsListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Все долги (деканат)
      tags:
      - debts
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные долга
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDebtRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.DebtResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Открытый долг уже существует
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Поставить долг (преподаватель)
      tags:
      - debts
  /api/debts/{id}:
    get:
      parameters:
      - description: UUID долга
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DebtResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Долг по ID
      tags:
      - debts
  /api/debts/{id}/cancel:
    patch:
      parameters:
      - description: UUID долга
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: ""
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отменить долг (деканат)
      tags:
      - debts
  /api/debts/{id}/grade:
    patch:
      consumes:
      - application/json
      parameters:
      - description: UUID долга
        in: path
        name: id
        required: true
        type: string
      - description: Оценка (2-5)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.GradeDebtRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DebtResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Долг не в статусе open
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Выставить оценку за долг
      tags:
      - debts
  /api/debts/by-discipline:
    get:
      parameters:
      - description: Лимит
        in: query
        name: limit
        type: integer
      - description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.DebtResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Долги по моим дисциплинам (преподаватель)
      tags:
      - debts
  /api/debts/my:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.DebtResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Мои долги (студент)
      tags:
      - debts
  /api/debts/summary:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.DebtSummaryRow'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Сводка долгов по дисциплинам
      tags:
      - debts
  /api/disciplines:
    get:
      parameters:
      - description: Лимит (default 50)
        in: query
        name: limit
        type: integer
      - description: Смещение (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DisciplinesListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список дисциплин
      tags:
      - disciplines
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные дисциплины
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDisciplineRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.DisciplineResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Code или Name уже заняты
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать дисциплину
      tags:
      - disciplines
  /api/disciplines/{id}:
    delete:
      parameters:
      - description: UUID дисциплины
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: ""
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить дисциплину (soft-delete)
      tags:
      - disciplines
    get:
      parameters:
      - description: UUID дисциплины
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DisciplineResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Дисциплина по ID
      tags:
      - disciplines
    patch:
      consumes:
      - application/json
      parameters:
      - description: UUID дисциплины
        in: path
        name: id
        required: true
        type: string
      - description: Поля для обновления
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateDisciplineRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DisciplineResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить дисциплину
      tags:
      - disciplines
  /api/disciplines/{id}/restore:
    post:
      parameters:
      - description: UUID дисциплины
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: ""
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Восстановить дисциплину
      tags:
      - disciplines
  /api/disciplines/{id}/students:
    get:
      parameters:
      - description: UUID дисциплины
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.UserResponse'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Студенты дисциплины
      tags:
      - disciplines
    post:
      consumes:
      - application/json
      parameters:
      - description: UUID дисциплины
        in: path
        name: id
        required: true
        type: string
      - description: Студент и период обучения
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AttachStudentRequest'
      responses:
        "204":
          description: ""
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Зачислить студента на дисциплину
      tags:
      - disciplines
  /api/disciplines/{id}/students/{user_id}:
    delete:
      parameters:
      - description: UUID дисциплины
        in: path
        name: id
        required: true
        type: string
      - description: UUID студента
        in: path
        name: user_id
        required: true
        type: string
      responses:
        "204":
          description: ""
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отчислить студента с дисциплины
      tags:
      - disciplines
  /api/disciplines/{id}/teachers:
    get:
      parameters:
      - description: UUID дисциплины
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.UserResponse'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Преподаватели дисциплины
      tags:
      - disciplines
    post:
      consumes:
      - application/json
      parameters:
      - description: UUID дисциплины
        in: path
        name: id
        required: true
        type: string
      - description: ID преподавателя
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AttachTeacherRequest'
      responses:
        "204":
          description: ""
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Назначить преподавателя на дисциплину
      tags:
      - disciplines
  /api/disciplines/{id}/teachers/{user_id}:
    delete:
      parameters:
      - description: UUID дисциплины
        in: path
        name: id
        required: true
        type: string
      - description: UUID преподавателя
        in: path
        name: user_id
        required: true
        type: string
      responses:
        "204":
          description: ""
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Снять преподавателя с дисциплины
      tags:
      - disciplines
  /api/me/disciplines/student:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.DisciplineResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Мои дисциплины (как студент)
      tags:
      - disciplines
  /api/me/disciplines/teacher:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.DisciplineResponse'
            type: array
        "401":
          description: Unauthorized
