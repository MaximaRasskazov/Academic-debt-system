version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries"
    schema: "sql/migrations"
    gen:
      go:
        package: "queries"
        out: "internal/repo/queries"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_interface: true
        emit_db_tags: false
        sql_package: "pgx/v5"
