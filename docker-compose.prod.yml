# Ротация логов для всех сервисов: до 4 файлов по 50 МБ = ~200 МБ на
# контейнер, дальше старое затирается. Защищает диск от разрастания логов.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '50m'
    max-file: '4'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    expose:
      - '1025'
      - '8025'
    logging: *default-logging
    restart: unless-stopped

  backend:
    image: ghcr.io/maximarasskazov/academic-debt-system/backend:latest
    environment:
      APP_ENV: production
      APP_PORT: '8080'
      LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}

      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:?ACCESS_TOKEN_TTL is required}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:?REFRESH_TOKEN_TTL is required}

      COOKIE_SECURE: ${COOKIE_SECURE:?COOKIE_SECURE is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN?COOKIE_DOMAIN must be set in .env}
      COOKIE_PATH: ${COOKIE_PATH:?COOKIE_PATH is required}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:?COOKIE_SAMESITE is required}

      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}

      SEED_DEV_ACCOUNTS: ${SEED_DEV_ACCOUNTS:?SEED_DEV_ACCOUNTS is required}

      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_USER: ${SMTP_USER?SMTP_USER must be set in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD?SMTP_PASSWORD must be set in .env}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}

      EMULATOR_URL: ${EMULATOR_URL?EMULATOR_URL must be set in .env}
      EMULATOR_API_KEY: ${EMULATOR_API_KEY?EMULATOR_API_KEY must be set in .env}
      SYNC_INTERVAL: ${SYNC_INTERVAL:?SYNC_INTERVAL is required}
    expose:
      - '8080'
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # /health дёргает пул БД; busybox wget есть в alpine из коробки.
      # start_period покрывает время на goose-миграции при старте, чтобы
      # ранние падения не засчитывались как unhealthy.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:8080/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging
    restart: unless-stopped

  frontend:
    image: ghcr.io/maximarasskazov/academic-debt-system/frontend:latest
    expose:
      - '80'
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      MAIL_DOMAIN: ${MAIL_DOMAIN:?MAIL_DOMAIN is required}
      MAILPIT_USER: ${MAILPIT_USER:?MAILPIT_USER is required}
      MAILPIT_PASS_HASH: ${MAILPIT_PASS_HASH:?MAILPIT_PASS_HASH is required}
    depends_on:
      - frontend
      - mailpit
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
