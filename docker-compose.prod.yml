services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER:     ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB:       ${DB_NAME:?DB_NAME is required}
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV:  production
      APP_PORT: '8080'
      LOG_LEVEL: ${LOG_LEVEL:-info}

      DB_HOST:     postgres
      DB_PORT:     '5432'
      DB_NAME:     ${DB_NAME:?DB_NAME is required}
      DB_USER:     ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      JWT_SECRET:        ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL:  ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}

      COOKIE_SECURE:   'true'
      COOKIE_DOMAIN:   ${COOKIE_DOMAIN:-}
      COOKIE_PATH:     ${COOKIE_PATH:-/}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}

      # Фронтенд и API живут на одном домене через nginx фронтенда.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}

      # SMTP опционально — при пустом SMTP_HOST email отключён,
      # WS-уведомления продолжают работать.
      SMTP_HOST:     ${SMTP_HOST:-}
      SMTP_PORT:     ${SMTP_PORT:-587}
      SMTP_USER:     ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM:     ${SMTP_FROM:-noreply@localhost}

      SEED_DEV_ACCOUNTS: 'false'

      # Синхронизация с эмулятором деканата — опционально.
      EMULATOR_URL:     ${EMULATOR_URL:-}
      EMULATOR_API_KEY: ${EMULATOR_API_KEY:-}
      SYNC_INTERVAL:    ${SYNC_INTERVAL:-5m}
    expose:
      - '8080'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - '${APP_PORT:-80}:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
