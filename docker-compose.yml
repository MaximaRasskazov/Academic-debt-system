services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-academic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-academic}
      POSTGRES_DB: ${DB_NAME:-academic_debts}
    ports:
      # Снаружи 15432, чтобы не конфликтовать с локально установленным postgres
      # на стандартном порту (у разных членов команды может быть свой
      # postgres). Внутри docker-сети по-прежнему 5432.
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-academic_debts}
      DB_USER: ${DB_USER:-academic}
      DB_PASSWORD: ${DB_PASSWORD:-academic}
      # JWT_SECRET обязателен — обязательно задать в .env на хосте.
      # Для запуска через compose положите .env рядом с этим файлом
      # с содержимым: JWT_SECRET=...openssl rand -hex 32...
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_PATH: ${COOKIE_PATH:-/}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      # Если true, entrypoint после миграций накатит sql/seeds/* с
      # демо-аккаунтами. В prod держать false.
      SEED_DEV_ACCOUNTS: ${SEED_DEV_ACCOUNTS:-false}
      EMULATOR_URL: ${EMULATOR_URL:-}
      EMULATOR_API_KEY: ${EMULATOR_API_KEY:-}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-5m}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Фронт в dev-режиме: Vite dev-сервер с hot-reload. Сорсы монтируются
  # с хоста, node_modules остаются в контейнере (анонимный том, чтобы
  # хостовские node_modules для другой ОС не перетёрли образ).
  #
  # VITE_BACKEND_URL=http://backend:8080 — потому что внутри docker-сети
  # фронт видит backend по имени сервиса, а не по localhost.
  # CHOKIDAR_USEPOLLING=true — на Windows/macOS bind-mount не отдаёт
  # inotify-события, без polling hot-reload не работает.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      VITE_BACKEND_URL: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/src
      - /src/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
